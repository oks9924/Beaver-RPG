name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  GODOT_VERSION: 4.4.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot && chmod +x /usr/local/bin/godot
          godot --version
      - name: Import project (class cache)
        run: godot --headless --path . --import || true
      - name: Lint all scripts
        run: godot --headless --path . -- --tool=lint_all
      - name: Asset manifest check (AST-01)
        run: godot --headless --path . -- --tool=check_assets
      - name: Unit tests
        run: godot --headless --path . -- --tool=run_tests
      - name: Integration tests (server + multiple headless clients)
        run: tests/integration/run_integration.sh /usr/local/bin/godot
      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/out/
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot && chmod +x /usr/local/bin/godot
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Build all targets
        run: GODOT=/usr/local/bin/godot scripts/build.sh all
      - name: Export smoke test (exported server + client run outside the project dir)
        run: tests/integration/run_export_smoke.sh /usr/local/bin/godot
      - name: Package
        run: |
          VER="${GITHUB_REF_NAME}"
          case "$VER" in v*) ;; *) VER="dev-${GITHUB_SHA::7}";; esac
          mkdir -p dist
          (cd build/windows && zip -qr "../../dist/tail-expedition-client-windows-${VER}.zip" .)
          (cd build/linux-server && tar -czf "../../dist/tail-expedition-server-linux-${VER}.tar.gz" .)
          (cd build/windows-server && zip -qr "../../dist/tail-expedition-server-windows-${VER}.zip" .)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
